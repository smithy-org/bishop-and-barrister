name: challenge

# The Lean challenge core. On every change: build (which checks every proof; Audit.lean fails the build if a
# theorem is missing or uses sorry) and run the tests. On a release tag: build bab-challenge for five platforms
# and attach the binaries, with their SHA-256s, to the release, then the claude.ai zip of the skill.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths: ['challenge/**', 'scripts/**', 'tests/test_challenge.py', 'evals/challenges/**', '.github/workflows/challenge.yml']
  # Every pull request, whatever it touches: proofs is a required check on main, and a required check that
  # never starts would hold the pull request open.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: challenge
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the Lean toolchain
        # releases.lean-lang.org sometimes refuses the TLS connection, and lake build would fail on its first
        # download. Install the pinned toolchain first, trying three times.
        shell: bash
        run: |
          for try in 1 2 3; do
            elan toolchain install "$(cat lean-toolchain)" && exit 0
            echo "::warning::Lean toolchain download failed (try $try of 3)"
            sleep 20
          done
          exit 1
      - name: Build and check the proofs
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Every declaration has a doc comment
        # linter.missingDocs (challenge/lakefile.lean) warns on any public declaration without `/-- -/`; doc-gen4
        # builds the reference from those comments, so a missing one fails here.
        run: |
          if grep -n "missing doc string" build.log; then
            echo "::error::add a /-- -/ doc comment to each declaration listed above"; exit 1
          fi
      - name: Run the tests
        run: lake test
      - name: The release tag is the binary's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built=$(.lake/build/bin/bab-challenge version | awk '{print $2}')
          if [ "v$built" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but bab-challenge says $built; bump the version in challenge/Main.lean first"
            exit 1
          fi
          plugin=$(python3 -c "import json; print(json.load(open('../.claude-plugin/plugin.json'))['version'])")
          if [ "v$plugin" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but .claude-plugin/plugin.json says $plugin; Claude Code only updates installs when it changes"
            exit 1
          fi
      - name: No sorry or admit in the sources
        run: |
          if grep -rnE --include='*.lean' --exclude-dir=.lake '(^|[[:space:](])(sorry|admit)([[:space:])]|$)' .; then
            echo "::error::a proof is missing"; exit 1
          fi
      - name: The CLI answers
        run: |
          echo '{"events": []}' | .lake/build/bin/bab-challenge replay
      - name: The Python wrapper's tests, against this core
        working-directory: .
        env:
          BISHOP_AND_BARRISTER_CHALLENGE_BIN: ${{ github.workspace }}/challenge/.lake/build/bin/bab-challenge
        run: python3 -m unittest tests.test_challenge -v

  # On a tag the binaries go to the release; run by hand, they are kept as the run's artifacts.
  binaries:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: proofs
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: challenge
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install elan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -o elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install the Lean toolchain
        # releases.lean-lang.org sometimes refuses the TLS connection, and lake build would fail on its first
        # download. Install the pinned toolchain first, trying three times.
        shell: bash
        run: |
          for try in 1 2 3; do
            elan toolchain install "$(cat lean-toolchain)" && exit 0
            echo "::warning::Lean toolchain download failed (try $try of 3)"
            sleep 20
          done
          exit 1
      - name: Build and check the proofs
        run: lake build
      - name: Package
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="bab-challenge-${{ matrix.target }}$ext"
          cp ".lake/build/bin/bab-challenge$ext" "$out"
          echo '{"events": []}' | "./$out" replay
          if command -v sha256sum >/dev/null; then sha256sum "$out" > "$out.sha256"; else shasum -a 256 "$out" > "$out.sha256"; fi
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Keep as an artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            challenge/${{ env.ASSET }}
            challenge/${{ env.ASSET }}.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber

  # The pins for challenge/binaries.json: each binary's file name and SHA-256, attached as pins.json.
  pins:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Collect the SHA-256s
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p '*.sha256' -D sums
          python3 - <<'PY'
          import json, os, pathlib, re
          binaries = {}
          for f in sorted(pathlib.Path("sums").glob("*.sha256")):
              digest, name = f.read_text().split()[:2]
              name = name.lstrip("*")
              target = re.fullmatch(r"bab-challenge-(.+?)(\.exe)?", name).group(1)
              binaries[target] = {"file": name, "sha256": digest}
          pins = {"release": os.environ["GITHUB_REF_NAME"], "binaries": binaries}
          pathlib.Path("pins.json").write_text(json.dumps(pins, indent=2) + "\n")
          print(json.dumps(pins, indent=2))
          PY
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" pins.json --clobber

  # The skill for claude.ai's skills settings: one bishop-and-barrister/ folder with only the runtime files,
  # shipping this release's own pins, attached to the release as bishop-and-barrister.zip.
  skill-zip:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pins
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p pins.json -D release
          python3 tools/package_skill.py --pins release/pins.json --out bishop-and-barrister.zip
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" bishop-and-barrister.zip --clobber
