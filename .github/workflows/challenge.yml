name: challenge

# The Lean challenge core. On every change: build (which checks every proof; Audit.lean fails the build if a
# theorem is missing or uses sorry) and run the tests. On a release tag: build bab-challenge for five platforms
# and attach the binaries, with their SHA-256s, to the release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['challenge/**', '.github/workflows/challenge.yml']
  pull_request:
    paths: ['challenge/**', '.github/workflows/challenge.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: challenge
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and check the proofs
        run: lake build
      - name: Run the tests
        run: lake test
      - name: No sorry or admit in the sources
        run: |
          if grep -rnE --include='*.lean' --exclude-dir=.lake '(^|[[:space:](])(sorry|admit)([[:space:])]|$)' .; then
            echo "::error::a proof is missing"; exit 1
          fi
      - name: The CLI answers
        run: |
          echo '{"events": []}' | .lake/build/bin/bab-challenge replay

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: proofs
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: challenge
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install elan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -o elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build and check the proofs
        run: lake build
      - name: Package
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="bab-challenge-${{ matrix.target }}$ext"
          cp ".lake/build/bin/bab-challenge$ext" "$out"
          echo '{"events": []}' | "./$out" replay
          if command -v sha256sum >/dev/null; then sha256sum "$out" > "$out.sha256"; else shasum -a 256 "$out" > "$out.sha256"; fi
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber
