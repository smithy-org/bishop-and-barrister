name: tests

# Every Python test, with coverage of scripts/, on the oldest Python the skill supports. The challenge core is
# built first so the challenge tests run instead of being skipped. Fails below the fail_under in .coveragerc.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the challenge core
        working-directory: challenge
        run: lake build
      - name: Install the test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the tests with coverage
        env:
          BISHOP_AND_BARRISTER_CHALLENGE_BIN: ${{ github.workspace }}/challenge/.lake/build/bin/bab-challenge
          # The tests' records are git repositories in temporary folders. After a commit, git can start its
          # housekeeping in the background, which may still be writing into .git when a test deletes the
          # folder ("Directory not empty: '.git'"). Turn it off for the tests' git commands.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: gc.auto
          GIT_CONFIG_VALUE_1: '0'
        run: python -m coverage run -m unittest discover -s tests
      - name: Coverage report (fails below the threshold)
        run: |
          python -m coverage combine
          python -m coverage report | tee coverage.txt
          python -m coverage html -d htmlcov --fail-under=0
      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: ignore
